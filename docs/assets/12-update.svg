<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">An associative point follows a moved center / 中心の移動に関連付け点が追従</title>
  <desc id="desc">Illustrative update: moving a source circle translates its center point. A radius-only change leaves the center unchanged. Not live NX test evidence.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#16324f"/></marker></defs>
  <rect width="960" height="350" rx="16" fill="#f5f8fc"/>
  <g font-family="Segoe UI, Yu Gothic, sans-serif" fill="#16324f">
    <text x="30" y="40" font-size="25" font-weight="700">Keep the parent link / 親の円との関連付けを保持</text><text x="30" y="72" font-size="17">ILLUSTRATIVE UPDATE, not a live NX test / 更新の説明図（NXでの実測結果ではありません）</text>
    <circle cx="204" cy="207" r="68" fill="none" stroke="#267bb5" stroke-width="4"/><circle cx="648" cy="207" r="68" fill="none" stroke="#9aa7b5" stroke-width="2" stroke-dasharray="7 5"/><circle cx="776" cy="178" r="68" fill="none" stroke="#267bb5" stroke-width="4"/>
    <g fill="#ef8c23"><circle cx="204" cy="207" r="8"/><circle cx="776" cy="178" r="8"/></g>
    <g stroke="#16324f" stroke-width="2" marker-end="url(#a)"><path d="M320 202h203"/><path d="M661 204l96-22"/></g>
    <g font-size="20"><text x="355" y="153">Move + Update</text><text x="355" y="182">移動して更新</text><text x="113" y="312">Before / 変更前</text><text x="686" y="312">After / 更新後</text></g>
  </g>
</svg>
