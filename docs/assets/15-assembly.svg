<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Before: weatherstrip and panels / 作成前：ウェザーストリップとパネル</title>
  <desc id="desc">Conceptual isometric door seal and panel geometry. These inputs must be eligible work-part bodies, not assembly occurrence bodies. Different colors identify engineering categories, not required NX display colors.</desc>
  <rect width="960" height="400" rx="16" fill="#f5f8fc"/>
  <g font-family="Segoe UI, Yu Gothic, sans-serif" fill="#16324f">
    <text x="30" y="40" font-size="25" font-weight="700">Seal and panel geometry / 元のパネル・シール形状を準備</text><text x="30" y="72" font-size="17">ISOMETRIC SCHEMATIC / 等角投影の模式図 · Work-part bodies only / 作業パート内のボディを使用</text>
    <path d="M130 290L290 130L615 130L455 290z" fill="#e5ebf1" stroke="#16324f" stroke-width="3"/><path d="M173 286L310 152L588 152L451 286z" fill="#fff" stroke="#9aa7b5" stroke-width="2"/>
    <path d="M212 289L326 177L617 177L503 289z" fill="none" stroke="#267bb5" stroke-width="14" stroke-linejoin="round"/>
    <path d="M227 309L341 197L632 197L518 309z" fill="none" stroke="#16324f" stroke-width="2"/>
    <g font-size="20"><text x="665" y="146">Body panel / ボディパネル</text><text x="665" y="204" fill="#267bb5">Seal / シール</text><text x="665" y="262">Door panel / ドアパネル</text></g>
    <g stroke="#9aa7b5" stroke-width="2" fill="none"><path d="M560 135L650 140"/><path d="M590 177L650 197"/><path d="M594 232L650 255"/></g>
    <text x="30" y="371" font-size="19">Work-part bodies, not occurrences / 作業パート内のボディを使用。オカレンスは対象外</text>
  </g>
</svg>
