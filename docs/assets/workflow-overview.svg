      <rect x="658" y="100" width="270" height="150" rx="12"/><rect x="345" y="340" width="270" height="150" rx="12"/>
      <rect x="658" y="340" width="270" height="150" rx="12"/>
    </g>
    <g font-size="21" font-weight="700"><text x="52" y="133">1-1  Circles / 円</text><text x="365" y="133">1-2  Centers / 中心点</text><text x="678" y="133">1-3  Spline / スプライン</text><text x="365" y="373">1-4  CSYS / 座標系</text><text x="678" y="373">1-5  Sections / 断面</text></g>
